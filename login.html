<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — My Todo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-bar">
    <span class="material-icons-round app-bar__icon">task_alt</span>
    <h1 class="app-bar__title">My Todo</h1>
  </header>

  <main class="auth-container">
    <div class="card auth-card">
      <h2 class="auth-title">로그인</h2>
      <form class="auth-form" id="loginForm" novalidate>
        <div class="text-field">
          <input type="email" id="email" placeholder=" " autocomplete="email" required>
          <label for="email">이메일</label>
          <div class="text-field__line"></div>
        </div>
        <div class="text-field">
          <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
          <label for="password">비밀번호</label>
          <div class="text-field__line"></div>
        </div>
        <p class="error-msg" id="errorMsg" hidden></p>
        <button type="submit" class="auth-btn" id="submitBtn">로그인</button>
      </form>

      <div class="auth-divider"><span>또는</span></div>

      <div class="social-btns">
        <button class="social-btn social-btn--google" id="googleBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google로 계속하기
        </button>
        <button class="social-btn social-btn--github" id="githubBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          GitHub로 계속하기
        </button>
      </div>

      <p class="auth-link">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    getSession().then(session => {
      if (session) location.href = 'index.html';
    });

    document.getElementById('googleBtn').addEventListener('click', () => signInWithGoogle());
    document.getElementById('githubBtn').addEventListener('click', () => signInWithGitHub());

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg  = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = '로그인 중...';

      const { error } = await signIn(email, password);

      if (error) {
        errorMsg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
        errorMsg.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      } else {
        location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
