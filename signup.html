<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — My Todo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-bar">
    <span class="material-icons-round app-bar__icon">task_alt</span>
    <h1 class="app-bar__title">My Todo</h1>
  </header>

  <main class="auth-container">
    <div class="card auth-card">
      <h2 class="auth-title">회원가입</h2>
      <form class="auth-form" id="signupForm" novalidate>
        <div class="text-field">
          <input type="email" id="email" placeholder=" " autocomplete="email" required>
          <label for="email">이메일</label>
          <div class="text-field__line"></div>
        </div>
        <div class="text-field">
          <input type="password" id="password" placeholder=" " autocomplete="new-password" required>
          <label for="password">비밀번호 (6자 이상)</label>
          <div class="text-field__line"></div>
        </div>
        <div class="text-field">
          <input type="password" id="passwordConfirm" placeholder=" " autocomplete="new-password" required>
          <label for="passwordConfirm">비밀번호 확인</label>
          <div class="text-field__line"></div>
        </div>
        <p class="error-msg" id="errorMsg" hidden></p>
        <button type="submit" class="auth-btn" id="submitBtn">가입하기</button>
      </form>
      <p class="auth-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email           = document.getElementById('email').value.trim();
      const password        = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      const errorMsg        = document.getElementById('errorMsg');
      const submitBtn       = document.getElementById('submitBtn');

      errorMsg.hidden = true;

      if (password.length < 6) {
        errorMsg.textContent = '비밀번호는 6자 이상이어야 합니다.';
        errorMsg.hidden = false;
        return;
      }

      if (password !== passwordConfirm) {
        errorMsg.textContent = '비밀번호가 일치하지 않습니다.';
        errorMsg.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '가입 중...';

      const { error } = await signUp(email, password);

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = '가입하기';
      } else {
        location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
